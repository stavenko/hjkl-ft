name = "bug-report-worker-dev"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
# Pin worker-build to match the `worker`/`wasm-bindgen` versions — an unpinned
# `cargo install worker-build` pulls a newer build that passes wasm-bindgen flags
# the locked CLI doesn't support.
command = "cargo install -q worker-build --version 0.8.5 && worker-build --release"

[[durable_objects.bindings]]
name = "BUG_REPORT_DO"
class_name = "BugReportDO"

# Fresh DO: the worker is deleted + recreated to wipe old (KV-API) data, so a
# single v1 SQLite migration applies cleanly to the brand-new namespace.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BugReportDO"]

# Клиентские ошибки: приложение шлёт их в POST /event, отсюда они уходят точками
# данных. Раскладка столбцов описана в lib.rs у record_event — она позиционная,
# менять только добавлением в конец.
# Хранение логов воркера (Workers Logs). Без него строки видно только в живом
# `wrangler tail`: искать по ним и вешать оповещение не на чем. Здесь этим логом
# сообщается о еде, которую модель не смогла опознать (строка ALERT
# unrecognised-food в record_detection).
# Суточная сводка о неопознанной еде уходит в Telegram отсюда: 06:00 UTC — 09:00 МСК.
[triggers]
crons = ["0 6 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[[analytics_engine_datasets]]
binding = "CLIENT_ERRORS"
dataset = "renorma_client_errors_dev"

# Определения: что модель разобрала у людей — не сбои, а обычные вердикты. Свой
# датасет, а не ещё один вид в CLIENT_ERRORS: раскладка столбцов другая (числа в
# double), и поток на порядки плотнее — в общей таблице он утопил бы ошибки.
[[analytics_engine_datasets]]
binding = "CLIENT_DETECTIONS"
dataset = "renorma_client_detections_dev"

[vars]
JWT_SECRET = "dev-secret-change-in-production"
# Admin key for the read endpoint (GET /reports). Dev placeholder — harden later.
ADMIN_KEY = "dev-admin-key-change-in-production"
# Account teardown: payment-worker reaches /internal/user-wipe over a service
# binding and proves itself with this shared key (prod: Secrets Store below).
INTERNAL_PUSH_KEY = "dev-internal-push-key"

# ── Production (separate worker on bug.renorma.app, clean DO data) ──
# Deploy: wrangler deploy --env production
# Secrets: wrangler secret put JWT_SECRET --env production
#          wrangler secret put ADMIN_KEY  --env production
# Prod inherits the base [[migrations]] above (no separate prod migrations).
[env.production]
name = "bug-report-worker-prod"
workers_dev = false

[[env.production.routes]]
pattern = "bug.renorma.app"
custom_domain = true

[[env.production.durable_objects.bindings]]
name = "BUG_REPORT_DO"
class_name = "BugReportDO"

[env.production.triggers]
crons = ["0 6 * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.analytics_engine_datasets]]
binding = "CLIENT_ERRORS"
dataset = "renorma_client_errors"

[[env.production.analytics_engine_datasets]]
binding = "CLIENT_DETECTIONS"
dataset = "renorma_client_detections"

# JWT_SECRET is mounted from the global Secrets Store in prod (dev keeps the
# [vars] value above). The binding name MUST equal the env name the code reads.
[[env.production.secrets_store_secrets]]
binding = "JWT_SECRET"
store_id = "e2b7d6c72d1f44ea889bd02a27d215f7"
secret_name = "jwt-secret"

[[env.production.secrets_store_secrets]]
binding = "INTERNAL_PUSH_KEY"
store_id = "e2b7d6c72d1f44ea889bd02a27d215f7"
secret_name = "internal-push-key"
