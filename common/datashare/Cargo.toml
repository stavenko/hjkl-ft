[package]
name = "datashare"
version = "0.1.0"
edition = "2021"

# Разбор и отрисовка присланных пользователем наборов данных. Крейт общий у
# админки и кураторского приложения: и там и там это ОДНИ И ТЕ ЖЕ снимки одного
# и того же протокола, и расходиться их чтение не должно.

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
# Правила планок — те же, по которым живёт приложение худеющего. Куратор обязан
# видеть ТО ЖЕ число, к которому пришло бы приложение само; вторая копия формул
# означала бы, что человек и его куратор ведут разные программы.
plankas = { path = "../plankas" }
api-types = { path = "../api-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
