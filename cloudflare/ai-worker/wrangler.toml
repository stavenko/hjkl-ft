name = "ai-worker-dev"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
command = "cargo install -q worker-build --version 0.8.5 && worker-build --release"

[ai]
binding = "AI"

# Service binding to payment-worker (the OWNER of the subscription): the AI gate
# asks it `GET /subscription` over this binding, forwarding the caller's bearer
# token. payment-worker resolves its own SubscriptionDO by its private epoch, so
# this worker holds no knowledge of the DO's name/epoch — that coupling drifted
# once (reader stuck on an old epoch) and caused spurious 402 paywalls.
[[services]]
binding = "PAYMENT"
service = "payment-worker-dev"

[vars]
JWT_SECRET = "dev-secret-change-in-production"
# Best-effort neuro-token usage accounting: POST /internal/usage to payment-worker
# (over the PAYMENT service binding), X-Internal-Key-guarded. Same shared cross-worker
# key as payment-worker's INTERNAL_PUSH_KEY. Billing is best-effort — NOT a fail-closed
# required secret (its absence only skips reporting, never blocks the AI request).
INTERNAL_PUSH_KEY = "dev-internal-push-key"

# ── Сторонние модели (картинки) ───────────────────────────────────────────────
# Формат реестра: [{"models":[…],"url":"https://…/chat/completions","key":"ИМЯ"}].
# Имя из поля `key` должно быть объявлено отдельным биндингом Secrets Store (ниже),
# иначе запрос к такой модели вернёт 503.
#
# В ДЕВЕ реестр — обычная переменная, а не секрет, и вот почему. Секретного в нём
# нет: адрес ручки Alibaba публичен, имя ключа и так стоит биндингом ниже, а само
# значение ключа лежит в отдельном секрете. Зато в секрете лежал БЕЛЫЙ СПИСОК
# моделей — и один и тот же секрет читали дев и прод, так что добавление модели
# для замера немедленно меняло прод. Теперь список правится коммитом, под ревью, и
# дев с продом развязаны. В ПРОДЕ (ниже) реестр остаётся в Secrets Store.
#
# Модели — то, что авторизовано в Model Studio под этим ключом. Приложение через
# этот путь просит только qwen3-vl-plus; остальные нужны замерам (scripts/measure-*).
THIRDPARTY_PROVIDERS = '''[{"models":[
  "qwen3-vl-plus","qwen-vl-max","qwen-vl-plus","qwen-vl-ocr","qwen3-vl-flash",
  "qwen3-vl-32b-instruct","qwen3-vl-32b-thinking","qwen3-vl-30b-a3b-instruct",
  "qwen3-vl-8b-instruct","qwen3-vl-235b-a22b-instruct","qwen3-vl-235b-a22b-thinking",
  "qwen3.8-max"
],"url":"https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions",
"key":"QWEN_STUDIO_API_KEY_SINGAPOUR"}]'''

# Ключ Alibaba Cloud Model Studio, регион Singapore. Имя биндинга = имя, которым
# на него ссылается поле `key` в реестре. ЭТО и есть единственное секретное здесь.
[[secrets_store_secrets]]
binding = "QWEN_STUDIO_API_KEY_SINGAPOUR"
store_id = "e2b7d6c72d1f44ea889bd02a27d215f7"
secret_name = "QWEN_STUDIO_API_KEY_SINGAPOUR"

# ── Production (separate worker on ai.renorma.app) ──
# Deploy: wrangler deploy --env production
# Secrets: wrangler secret put JWT_SECRET --env production
[env.production]
name = "ai-worker-prod"
workers_dev = false

[[env.production.routes]]
pattern = "ai.renorma.app"
custom_domain = true

[env.production.ai]
binding = "AI"

# Service binding to the prod owner (payment-worker-prod).
[[env.production.services]]
binding = "PAYMENT"
service = "payment-worker-prod"

# JWT_SECRET is mounted from the global Secrets Store in prod (dev keeps the
# [vars] value above). The binding name MUST equal the env name the code reads.
[[env.production.secrets_store_secrets]]
binding = "JWT_SECRET"
store_id = "e2b7d6c72d1f44ea889bd02a27d215f7"
secret_name = "jwt-secret"

# Shared cross-worker key for the best-effort usage-report POST to payment-worker's
# /internal/usage. SAME value as payment-worker-prod's INTERNAL_PUSH_KEY. Billing is
# best-effort → NOT added to require_secrets (its absence only skips reporting).
[[env.production.secrets_store_secrets]]
binding = "INTERNAL_PUSH_KEY"
store_id = "e2b7d6c72d1f44ea889bd02a27d215f7"
secret_name = "internal-push-key"

# Реестр сторонних провайдеров — тот же секрет, что и в деве (см. комментарий выше).
[[env.production.secrets_store_secrets]]
binding = "THIRDPARTY_PROVIDERS"
store_id = "e2b7d6c72d1f44ea889bd02a27d215f7"
secret_name = "thirdparty-providers"

[[env.production.secrets_store_secrets]]
binding = "QWEN_STUDIO_API_KEY_SINGAPOUR"
store_id = "e2b7d6c72d1f44ea889bd02a27d215f7"
secret_name = "QWEN_STUDIO_API_KEY_SINGAPOUR"
