[package]
name = "pwa-prompt"
version = "0.1.0"
edition = "2021"

# Опознание браузера и пошаговые инструкции по установке PWA. Крейт общий:
# кураторское приложение ставится ТЕМИ ЖЕ способами, что и приложение худеющего,
# и разъезжаться этим двум наборам экранов нельзя — их выстрадали на живых
# устройствах, и вторая копия неизбежно отстанет.

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
web-sys = { version = "0.3", features = ["Window", "Navigator"] }
