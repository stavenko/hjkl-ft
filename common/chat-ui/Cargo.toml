[package]
name = "chat-ui"
version = "0.1.0"
edition = "2021"

# Вид живого чата — общий у приложения худеющего и кураторского. Разговор один и
# тот же, и выглядеть он обязан одинаково с обеих сторон: человек и куратор
# смотрят в одну переписку, просто с разных концов.

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
