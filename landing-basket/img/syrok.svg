<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#E8EDF5"/>
    </linearGradient>
    <linearGradient id="choc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4326"/><stop offset="55" stop-color="#4A2C17"/><stop offset="1" stop-color="#38200F"/>
    </linearGradient>
    <linearGradient id="curd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#F2E9D8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0E1630" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="760" height="570" fill="url(#bg)"/>

  <!-- целый сырок -->
  <g filter="url(#sh)">
    <rect x="96" y="196" width="300" height="150" rx="34" fill="url(#choc)"/>
    <rect x="96" y="196" width="300" height="150" rx="34" fill="none" stroke="#2B1709" stroke-width="3" opacity=".5"/>
    <!-- глазурные волны сверху -->
    <path d="M110 232 q24 -16 48 0 t48 0 t48 0 t48 0 t48 0" fill="none" stroke="#8A5A33" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="180" cy="252" rx="34" ry="14" fill="#FFFFFF" opacity=".13"/>
  </g>

  <!-- надкушенный: видно творожную середину -->
  <g filter="url(#sh)">
    <path d="M400 250 h250 a34 34 0 0 1 34 34 v92 a34 34 0 0 1 -34 34 h-250 a34 34 0 0 1 -34 -34 v-92 a34 34 0 0 1 34 -34 z" fill="url(#choc)"/>
    <path d="M400 262 h238 a24 24 0 0 1 24 24 v88 a24 24 0 0 1 -24 24 h-238 a24 24 0 0 1 -24 -24 v-88 a24 24 0 0 1 24 -24 z" fill="url(#curd)"/>
    <path d="M376 286 a24 24 0 0 1 24 -24 h16 v136 h-16 a24 24 0 0 1 -24 -24 z" fill="url(#choc)"/>
    <!-- крошки творога -->
    <circle cx="470" cy="300" r="5" fill="#FFFFFF" opacity=".75"/>
    <circle cx="530" cy="330" r="4" fill="#FFFFFF" opacity=".6"/>
    <circle cx="590" cy="308" r="5" fill="#FFFFFF" opacity=".7"/>
    <circle cx="505" cy="360" r="3.5" fill="#FFFFFF" opacity=".55"/>
  </g>

  <!-- подпись-калории -->
  <g>
    <rect x="96" y="404" width="176" height="58" rx="29" fill="#DEF7EC"/>
    <text x="184" y="441" font-family="Golos Text, system-ui, sans-serif" font-size="24" font-weight="700"
          fill="#04603F" text-anchor="middle">180 ккал</text>
  </g>
  <text x="292" y="441" font-family="Golos Text, system-ui, sans-serif" font-size="21"
        fill="#39425F">— и это помещается в план</text>
</svg>